name: 뉴스 봇 스케줄러

on:
  schedule:
    - cron: '*/15 * * * *'  # 15분마다 실행
  workflow_dispatch:

jobs:
  send-news:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v3

      - name: Python 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 라이브러리 설치
        run: |
          pip install -r requirements.txt

      - name: 전송 기록 캐시 복원
        uses: actions/cache@v3
        with:
          path: .sent_articles.json
          key: sent-articles-v1

      - name: 뉴스 봇 실행
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          KEYWORD: ${{ secrets.KEYWORD }}
          SLACK_WEBHOOK_URLS: ${{ secrets.SLACK_WEBHOOK_URLS }}
          SLACK_KEYWORDS: ${{ secrets.SLACK_KEYWORDS }}
        run: python main.py